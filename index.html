<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nébula | Artista Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <img src="assets/img/logo.jpg" alt="Logotipo de Nébula" width="60" height="60">
    <h1>Nébula</h1>
    <nav>
      <a href="#galeria">Galería</a>
      <a href="#video">Vídeo</a>
      <a href="#audio">Audio</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <main>

    <section class="hero">
      <figure>
        <img src="assets/img/hero.webp" alt="Paisaje futurista de ciencia ficción con un cielo lleno de estrellas" width="1920" height="1080">
      </figure>
      <p>Paisajes de ciencia ficción creados en digital.</p>
    </section>

    <section id="galeria">
      <h2>Galería de trabajos</h2>
      <div class="galeria">
        <figure>
          <img src="assets/img/img2.webp" alt="Paisaje desértico con formaciones rocosas bajo un gran sol" width="400" height="250" loading="lazy">
        </figure>
        <figure>
          <img src="assets/img/img1.webp" alt="Edificios abandonados entre dunas de arena del desierto" width="400" height="250" loading="lazy">
        </figure>
        <figure>
          <img src="assets/img/img3.webp" alt="Estructuras aisladas en un paisaje desértico" width="400" height="250" loading="lazy">
        </figure>
      </div>
    </section>

    <section id="video">
      <h2>Presentación</h2>
      <figure>
        <video controls poster="assets/img/poster.webp" width="640" height="360">
          <source src="assets/video/video.mp4" type="video/mp4">
          Tu navegador no soporta el vídeo.
        </video>
      </figure>
    </section>

    <section id="audio">
      <h2>Ambiente</h2>
      <figure>
        <audio controls>
          <source src="assets/audio/audio.mp3" type="audio/mpeg">
          Tu navegador no soporta el audio.
        </audio>
      </figure>
    </section>

    <section id="contacto">
      <h2>¿Hablamos?</h2>
      <a href="mailto:contacto@nebula.com">
        <img src="assets/img/frame_animado.webp" alt="Botón animado de contacto" width="200" height="80" loading="lazy">
      </a>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 Nébula. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
